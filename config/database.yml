default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

# Railway / Production ke liye PostgreSQL URL configuration
production:
  primary: &primary_production
    adapter: postgresql
    encoding: unicode
    url: <%= ENV.fetch("DATABASE_URL", "postgres://localhost/dummy_db") %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  
  cable:
    <<: *primary_production
    migrations_paths: db/cable_migrate
  
  cache:
    <<: *primary_production
    migrations_paths: db/cache_migrate
  
  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate